version: '3.8'

services:
  # Banco do OS Service (PostgreSQL)
  postgres-os:
    image: postgres:15
    container_name: oficina-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oficina_os
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Banco do Billing Service (MySQL)
  mysql-billing:
    image: mysql:8.0
    container_name: oficina-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: oficina_billing
      MYSQL_ROOT_PASSWORD: admin_password
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  # Banco do Execution Service (MongoDB)
  mongo-execution:
    image: mongo:6.0
    container_name: oficina-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    volumes:
      - mongo_data:/data/db

  # Mensageria (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: oficina-rabbitmq
    ports:
      - "5672:5672"   # Porta para o Java conectar
      - "15672:15672" # Painel Visual (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password

  # Servidor de Email Fake (MailHog) - ADICIONADO AQUI
  mailhog:
    image: mailhog/mailhog
    container_name: oficina-mailhog
    ports:
      - "1025:1025" # SMTP (Onde o Java manda o email)
      - "8025:8025" # Web UI (Onde você vê o email: http://localhost:8025)

  # Qualidade de Código (SonarQube) - ADICIONADO AQUI
  sonarqube:
    image: sonarqube:lts-community
    container_name: oficina-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: