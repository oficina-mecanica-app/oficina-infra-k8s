# Modelo do Secret usado por toda a stack (infra + microsserviços).
#
# Como usar:
#   cp secrets.example.yaml secrets.yaml   # secrets.yaml está no .gitignore
#   # edite os valores em secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Nunca faça commit de secrets.yaml com valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
type: Opaque
stringData:
  postgres-password: "troque-aqui"
  mysql-root-password: "troque-aqui"
  mongo-password: "troque-aqui"
  rabbitmq-password: "troque-aqui"
  # Token do Mercado Pago (use um token de TESTE fora de produção)
  mercadopago-access-token: "troque-aqui"
  # URL pública do billing-service, chamada pelo webhook do Mercado Pago
  mercadopago-notification-url: "https://seu-dominio-publico"
